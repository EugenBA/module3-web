[workspace]
members = [
    "blog-cli",
    "blog-client",
    "blog-server",
    "blog-wasm"
]

# Общие настройки для всех членов workspace
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Eugen Batts"]
license = "MIT"


[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tonic="0.14"
prost-types = "0.14"
prost="0.14"
tonic-prost="0.14"
serde_json = "1.0"
tokio = "1.49"