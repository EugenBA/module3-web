[package]
name = "blog-client"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
thiserror = "2.0"
reqwest = { version = "0.13", features = ["json"] }
tonic = "0.14"
serde_json = "1.0"
tokio = "1.49"
serde = "1.0"
chrono = { version = "0.4", features = ["serde"] }
prost-types = "0.14"
prost="0.14"
tonic-prost="0.14"

[build-dependencies]
tonic-prost-build = "0.14"