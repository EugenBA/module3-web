<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Client</title>
    <style>
        html {
            min-width: 100%;
            min-height: 100%;
        }
        h1, h2{
            margin-bottom: 0.5rem;
            line-height: 1.2;
            font-size: 1.5rem;
        }
        input, button{
            margin: 0;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }
        .width-full{
            width: 100%;
        }
        .width-70{
            width: 70%;
        }
        .hide{
            visibility: collapse;
        }
        .show{
            visibility: visible;
        }
        .caption{
            background-color: #e4a071;
            color: #474141;
            padding-left: 5px;
            padding-bottom: 1px;
            padding-top: 1px;
        }
        .caption_post{
            background-color: #b6b6b6;
            padding: 5px;
            font-size: 1rem;
        }
        .auth-forms{
            display: flex;
        }
        .auth-status{
            display: flex;
            justify-content: flex-start;
            width: 95%;
            height: 50px;
        }
        .nav-block{
            width: 80%;
        }
        .nav-item{
            cursor: pointer;
            padding-right: 5px;
        }
        .nav-item:hover{
            background-color: darkgrey;
            padding: 1px;
        }
        .in_menu{
        }
        .user_name{
            margin: 1%;
        }
        .separator{
            height: 2px;
            background-color: #333030;
            width: 100%;
        }
        .post-content{
            width: 100%;
        }
        .post-content:nth-child(odd){
            background-color: #7b9e9f;
        }
        .post-content:nth-child(even){
            background-color: #9eb8b8;
        }
        .post-created, .post-actions{
            padding-left: 10px;
            background-color: #b6b6b6;
        }
        .title{
            padding: 10px;
            font-style: italic;
            font-weight: bold;
            width: 28%;
            border-left: #b6b6b6 1px;
            border-bottom: #b6b6b6 1px;
        }
        .content{
            padding-left: 2px;
            padding-top: 5px;
            padding-bottom: 5px;
            width: 70%;
        }
        .padding-separator{
            height: 20px;
        }
        .post-editor{
            top: 1%;
            left: 20%;
            margin-right: -50%;
            width: 80%;
        }
        .flex{
            display: flex;
        }
        .input-editor-title{
            width: 80%;
            padding-left: 30px;
            padding-top: 5px;
        }
        .input-editor-content{
            width: 80%;
            height: 60%;
            padding-left: 30px;
            padding-top: 15px;
        }
        .font-size{
            font-size: 1.0em;
            font-family: inherit;
        }
        #logged, #unlogged{
            float: right;
            width: 100%;
            display: flex;
        }
        #login, #register {
            margin-bottom: 1%;
            width: 50%;
        }


    </style>
</head>
<body>
<div id="app">
    <div id="content"></div>
</div>

<script type="module">
    import init, { WasmBlogClient, set_panic_hook } from './pkg/blog_wasm.js';
    let client = null;

    async function initialize() {
        await init();
        set_panic_hook();
        const offset=0n;
        const limit=10n;
        client = await new WasmBlogClient("http://localhost:3000", 30);
        // Проверяем аутентификацию и загружаем посты
        await update_ui();
        await load_posts(limit, offset);
    }


    async function update_ui() {
        const isAuthenticated = client.is_authenticated();
        const currentUser =  client.get_current_user();
        let html = `
                <header>
                    <div class="caption">
                        <h1>Blog Client</h1>
                    </div>
                    <div class="auth-status">
            `;

        if (isAuthenticated && currentUser) {
            html += `<div id="logged">
                         <div class="nav-block"></div>
                         <div class="user_name">
                            <span>Logged in as: <b>${currentUser.username}</b></span>
                            <button onclick="logout()">Logout</button>
                            <div class="hide">${currentUser.id}</div>
                         </div>
                     </div>`;
        } else {
            html += `<div id="unlogged">
                      <div class="nav-block"></div>
                      <div class="in_menu">
                        <ul id="menu">
                         <il onclick="show_login()" class="nav-item" >Login</il>
                         <il onclick="show_register()" class="nav-item">Register</il>
                        </ul>
                      </div>
                      <div class="user_name">Not logged in</div>
                   </div>`;
        }

        html += `</div></header><div class="separator"></div>`;

        if (!isAuthenticated) {
            html += `
                    <div class="auth-forms">
                        <div id="login" class="login-form show">
                            <h2>Login</h2>
                            <form onsubmit="handleLogin(event)">
                                  <input type="text" id="login-username" placeholder="Username" required>
                                 <input type="password" id="login-password" placeholder="Password" required>
                                <button type="submit">Login</button>
                            </form>
                        </div>

                        <div id="register" class="register-form hide">
                            <h2>Register</h2>
                            <form onsubmit="handleRegister(event)">
                                <input type="text" id="register-username" placeholder="Username" required>
                                <input type="email" id="register-email" placeholder="Email" required>
                                <input type="password" id="register-password" placeholder="Password" required>
                                <button type="submit">Register</button>
                            </form>
                        </div>
                    </div>
                    <div class="separator"></div>
                `;
        }
        html += `<div id="posts-container"></div>
                     <div id="error-container"></div>`;
        if (isAuthenticated)  {
            html += `<div class="padding-separator width-full"></div>
                    <div class="width-full">
                        <div class="separator"></div>
                          <div class="caption_post"><b>Create New Post</b></div>
                        <div class="separator"></div>
                        <div class="padding-separator"></div>
                        <div class="width-full">
                        <div class="post-editor">
                        <form class="width-full" onsubmit="handleCreatePost(event)">
                            <div>Title</div>
                            <div>
                                <input class="input-editor-title font-size" type="text" id="post-title" placeholder="Title" required>
                            </div>
                            <div>Content</div>
                            <div>
                                <textarea class="input-editor-content font-size" id="post-content" placeholder="Content" required></textarea>
                            </div>
                            <input id="post-id" type="text" class="hide">
                            <div class="flex">
                                <div class="width-70"></div>
                                <div id="ct_create">
                                    <button type="submit">Create Post</button>
                                </div>
                                <div id="ct_update" class="hide">
                                  <button type="button" onclick="updatePost()">Update post</button>
                                  <button type="button" onclick="clearUpdatePost()">Cancel</button>
                                </div>
                            </div>
                            </form>
                            </div>
                        </div>
                    </div>
                `;
        }



        document.getElementById('content').innerHTML = html;
    }

    async function load_posts(limit=10n, offset=0n) {
        try {
            const posts = await client.list_posts(limit, offset);
            await  render_posts(posts);
        } catch (error) {
            show_error(error);
        }
    }

    async function render_posts(posts) {
        const container = document.getElementById('posts-container');
        if (!container) return;
        const isAuthenticated = client.is_authenticated();
        const currentUser =  client.get_current_user();

        let html = '<div class="post-list"><div class="caption_post">List post</div><div class="separator"></div>';

        if (posts && posts.length > 0) {
            posts.forEach(post => {
                html += `<div class="width-full flex" data-id="${post.id}">
                            <div class="post-created">Created: ${post.created_at}</div>
                            <div class="post-content">
                                <div id="t_${post.id}" class="title">${post.title}</div>
                                <div id="c_${post.id}" class="content">${post.content}</div>
                            </div>`;

               if (isAuthenticated && post.author_id === currentUser.id) {
                   html += `<div class="post-actions">
                                        <button onclick="editPost(${post.id})">Edit</button>
                                         <button onclick="deletePost(${post.id}n)">Delete</button>
                            </div>`;
               }
                html += '</div><div class="separator"></div>';
            });
        } else {
            html += '<div class="caption_post">No post list</div><div class="separator">';
        }

        html += '</div>';
        container.innerHTML = html;
    }

    // Обработчики событий
    window.handleLogin = async function(event) {
        event.preventDefault();

        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        if (!username || !password) {
            show_error("Please fill in all fields");
            return;
        }

        try {
            const login = await client.login(username, password);
            await update_ui();
            await load_posts();
            clear_error();
        } catch (error) {
            show_error(error);
        }
    };

    window.handleRegister = async function(event) {
        event.preventDefault();

        const username = document.getElementById('register-username').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;

        if (!username || !email || !password) {
            show_error("Please fill in all fields");
            return;
        }

        try {
            await client.register(username, email, password);
            await update_ui();
            await load_posts();
            clear_error();
        } catch (error) {
            show_error(error);
        }
    };

    window.logout = function() {
        client.logout();
        update_ui();
        load_posts();
    };

    window.show = function show(obj){
        obj.classList.remove("hide");
        obj.classList.add("show");
    }
    window.hide = function hide(obj){
        obj.classList.remove("show");
        obj.classList.add("hide");
    }

    window.handleCreatePost = async function(event) {
        event.preventDefault();

        const title = document.getElementById('post-title').value;
        const content = document.getElementById('post-content').value;

        if (!title || !content) {
            show_error("Title and content are required");
            return;
        }

        try {
            await client.create_post(title, content);
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';
            await load_posts();
            clear_error();
        } catch (error) {
            show_error(error);
        }
    };

    window.editPost = async function(id) {
        const title = document.getElementById("t_" + id);
        const content = document.getElementById("c_" + id);

        const editor_title = document.getElementById("post-title");
        const editor_content = document.getElementById("post-content");
        const editor_id = document.getElementById("post-id");
        editor_title.value = title.textContent;
        editor_content.value = content.textContent;
        editor_id.value = id;

        const bt_create = document.getElementById("ct_create");
        const bt_update = document.getElementById("ct_update");
        hide(bt_create);
        show(bt_update);


    };

    window.updatePost = async function() {
        const title = document.getElementById("post-title").value;
        const content = document.getElementById("post-content").value;
        const id = document.getElementById("post-id").value;
        try {
            await client.update_post(id, title, content);
            await load_posts();
            clear_error();
            clearUpdatePost();

        } catch (error) {
            show_error(error);
        }
    }


    window.clearUpdatePost = function() {
        const title = document.getElementById("post-title");
        const content = document.getElementById("post-content");
        const id = document.getElementById("post-id");
        const bt_create = document.getElementById("ct_create");
        const bt_update = document.getElementById("ct_update");
        title.value = "";
        content.value = "";
        id.value = "";
        show(bt_create);
        hide(bt_update);
    }

    window.deletePost = async function(id) {
        if (!confirm("Are you sure you want to delete this post?")) {
            return;
        }

        try {
            await client.delete_post(id);
            await load_posts();
            clear_error();
        } catch (error) {
            show_error(error);
        }
    };

    window.show_login = function(){
        const login = document.getElementById("login");
        const register = document.getElementById("register");
        show(login);
        hide(register);
    }
    window.show_register = function(){
        const login = document.getElementById("login");
        const register = document.getElementById("register");
        show(register);
        hide(login);
    }

    function show_error(message) {
        const container = document.getElementById('error-container');
        if (container) {
            container.innerHTML = `<div class="error">${message}</div>`;
        }
    }

    function clear_error() {
        const container = document.getElementById('error-container');
        if (container) {
            container.innerHTML = '';
        }
    }

    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', initialize);

</script>
</body>
</html>
