<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Client</title>
    <style>
        html {
            min-width: 100%;
            min-height: 100%;
        }
        h1, h2{
            margin-bottom: 0.5rem;
            line-height: 1.2;
            font-size: 1.5rem;
        }
        input, button{
            margin: 0;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }
        .hide{
            visibility: collapse;
        }
        .show{
            visibility: visible;
        }
        .caption{
            background-color: #e4a071;
            color: #474141;
            padding-left: 5px;
            padding-bottom: 1px;
            padding-top: 1px;
        }
        .auth-forms{
            display: flex;
        }
        .auth-status{
            display: flex;
            justify-content: flex-start;
            width: 95%;
            height: 50px;
        }
        .nav-block{
            width: 80%;
        }
        .nav-item{
            cursor: pointer;
            padding-right: 5px;
        }
        .nav-item:hover{
            background-color: darkgrey;
            padding: 1px;
        }
        .in_menu{
        }
        .user_name{
            margin: 1%;
        }
        .separator{
            height: 2px;
            background-color: #333030;
            width: 100%;
        }
        #logged, #unlogged{
            float: right;
            width: 100%;
            display: flex;
        }
        #login, #register {
            margin-bottom: 1%;
            width: 50%;
        }

    </style>
</head>
<body>
<div id="app">
    <div id="content"></div>
</div>
<script type="text/javascript">
    function show(obj){
        obj.classList.remove("hide");
        obj.classList.add("show");
    }
    function hide(obj){
        obj.classList.remove("show");
        obj.classList.add("hide");
    }
    function show_login(){
        const login = document.getElementById("login");
        const register = document.getElementById("register");
        show(login);
        hide(register);
    }
    function show_register(){
        const login = document.getElementById("login");
        const register = document.getElementById("register");
        show(register);
        hide(login);
    }
</script>

<script type="module">
    import init, { WasmBlogClient, set_panic_hook } from './pkg/blog_wasm.js';

    let client = null;

    async function initialize() {
        await init();
        set_panic_hook();
        const offset=10n;
        const limit=0n
        client = await new WasmBlogClient("http://localhost:3000", 30);
        // Проверяем аутентификацию и загружаем посты
        await update_ui();
        await load_posts(offset, limit);
    }


    async function update_ui() {
        const isAuthenticated = await client.is_authenticated();
        const currentUser =  client.get_current_user();
        let html = `
                <header>
                    <div class="caption">
                        <h1>Blog Client</h1>
                    </div>
                    <div class="auth-status">
            `;

        if (isAuthenticated && currentUser) {
            html += `<div id="logged">
                         <div class="nav-block"></div>
                         <div class="user_name">
                            <span>Logged in as: ${currentUser.username}</span>
                            <button onclick="logout()">Logout</button>
                            <div class="hide">${currentUser.id}</div>
                         </div>
                     </div>`;
        } else {
            html += `<div id="unlogged">
                      <div class="nav-block"></div>
                      <div class="in_menu">
                        <ul id="menu">
                         <il onclick="show_login()" class="nav-item" >Login</il>
                         <il onclick="show_register()" class="nav-item">Register</il>
                        </ul>
                      </div>
                      <div class="user_name">Not logged in</div>
                   </div>`;
        }

        html += `</div></header><div class="separator"></div>`;

        if (!isAuthenticated) {
            html += `
                    <div class="auth-forms">
                        <div id="login" class="login-form show">
                            <h2>Login</h2>
                            <form onsubmit="handleLogin(event)">
                                  <input type="text" id="login-username" placeholder="Username" required>
                                 <input type="password" id="login-password" placeholder="Password" required>
                                <button type="submit">Login</button>
                            </form>
                        </div>

                        <div id="register" class="register-form hide">
                            <h2>Register</h2>
                            <form onsubmit="handleRegister(event)">
                                <input type="text" id="register-username" placeholder="Username" required>
                                <input type="email" id="register-email" placeholder="Email" required>
                                <input type="password" id="register-password" placeholder="Password" required>
                                <button type="submit">Register</button>
                            </form>
                        </div>
                    </div>
                    <div class="separator"></div>
                `;
        } else {
            html += `
                    <div class="create-post-form">
                        <h2>Create New Post</h2>
                        <form onsubmit="handleCreatePost(event)">
                            <input type="text" id="post-title" placeholder="Title" required>
                            <textarea id="post-content" placeholder="Content" required></textarea>
                            <button type="submit">Create Post</button>
                        </form>
                    </div>
                `;
        }

        html += `<div id="posts-container"></div>
                     <div id="error-container"></div>`;

        document.getElementById('content').innerHTML = html;
    }

    async function load_posts(offset=10n, limit=0n) {
        try {
            const posts = await client.list_posts(offset, limit);
            render_posts(posts);
        } catch (error) {
            show_error(error);
        }
    }

    function render_posts(posts) {
        const container = document.getElementById('posts-container');
        if (!container) return;

        let html = '<div class="post-list"><h2>All Posts</h2>';

        if (posts && posts.length > 0) {
            posts.forEach(post => {
                html += `
                        <div class="post" data-id="${post.id}">
                            <h3>${post.title}</h3>
                            <p>${post.content}</p>
                            <div class="post-meta">
                                <span>Author: ${post.author_name}</span>
                                <span> | Created: ${post.created_at}</span>
                            </div>
                            <div class="post-actions">
                                <button onclick="editPost(${post.id}, '${post.title}', '${post.content}')">Edit</button>
                                <button onclick="deletePost(${post.id})">Delete</button>
                            </div>
                        </div>
                    `;
            });
        } else {
            html += '<p>No posts yet.</p>';
        }

        html += '</div>';
        container.innerHTML = html;
    }

    // Обработчики событий
    window.handleLogin = async function(event) {
        event.preventDefault();

        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        if (!username || !password) {
            show_error("Please fill in all fields");
            return;
        }

        try {
            const login = await client.login(username, password);
            console.log(login);
            await update_ui();
            await load_posts();
            clear_error();
        } catch (error) {
            show_error(error);
        }
    };

    window.handleRegister = async function(event) {
        event.preventDefault();

        const username = document.getElementById('register-username').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;

        if (!username || !email || !password) {
            show_error("Please fill in all fields");
            return;
        }

        try {
            await client.register(username, email, password);
            await update_ui();
            await load_posts();
            clear_error();
        } catch (error) {
            show_error(error);
        }
    };

    window.logout = function() {
        client.logout();
        update_ui();
        load_posts();
    };

    window.handleCreatePost = async function(event) {
        event.preventDefault();

        const title = document.getElementById('post-title').value;
        const content = document.getElementById('post-content').value;

        if (!title || !content) {
            show_error("Title and content are required");
            return;
        }

        try {
            await client.create_post(title, content);
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';
            await load_posts();
            clear_error();
        } catch (error) {
            show_error(error);
        }
    };

    window.editPost = async function(id, currentTitle, currentContent) {
        const newTitle = prompt("Enter new title:", currentTitle);
        if (newTitle === null) return;

        const newContent = prompt("Enter new content:", currentContent);
        if (newContent === null) return;

        if (!newTitle || !newContent) {
            show_error("Title and content are required");
            return;
        }

        try {
            await client.update_post(id, newTitle, newContent);
            await load_posts();
            clear_error();
        } catch (error) {
            show_error(error);
        }
    };

    window.deletePost = async function(id) {
        if (!confirm("Are you sure you want to delete this post?")) {
            return;
        }

        try {
            await client.delete_post(id);
            await load_posts();
            clear_error();
        } catch (error) {
            show_error(error);
        }
    };

    function show_error(message) {
        const container = document.getElementById('error-container');
        if (container) {
            container.innerHTML = `<div class="error">${message}</div>`;
        }
    }

    function clear_error() {
        const container = document.getElementById('error-container');
        if (container) {
            container.innerHTML = '';
        }
    }

    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', initialize);

</script>
</body>
</html>
